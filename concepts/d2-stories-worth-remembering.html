<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--serif:'Playfair Display',serif;--sans:'Jost',sans-serif;--ink:#171410;--cream:#f2ece0;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .container{max-width:1500px;margin:0 auto;padding:0 clamp(1.2rem,4vw,3rem);}
  .nav{padding:1.6rem 0;}
  .nav .container{display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;}
  .nav-links{display:flex;gap:1.7rem;list-style:none;margin:0;padding:0;}
  .nav-links a{font-family:var(--sans);font-weight:500;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;}

  .strip{display:flex;height:46vh;min-height:320px;}
  .strip a{flex:1;overflow:hidden;position:relative;}
  .strip img{width:100%;height:100%;object-fit:cover;}

  .row{display:grid;grid-template-columns:1.3fr 1fr;gap:2.5rem;align-items:end;padding:3.5rem 0 5rem;}
  .row h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,4.5vw,3.4rem);line-height:1.05;text-transform:uppercase;margin:0;}
  .row-text p{font-size:1rem;line-height:1.7;color:#4a4438;max-width:36ch;}
  .row-cta{display:inline-flex;align-items:center;gap:.7rem;margin-top:1rem;font-family:var(--sans);font-weight:500;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;}

  @media (max-width:820px){
    .strip{flex-direction:column;height:auto;}
    .strip a{aspect-ratio:4/5;}
    .row{grid-template-columns:1fr;gap:1.5rem;padding:3rem 0;}
    .nav .container{flex-direction:column;gap:.9rem;}
    .nav-links{gap:1rem;flex-wrap:wrap;justify-content:center;}
  }
</style>
</head>
<body>
