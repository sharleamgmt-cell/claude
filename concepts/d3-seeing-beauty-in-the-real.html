<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D3 — Seeing Beauty in the Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--serif:'Playfair Display',serif;--sans:'Jost',sans-serif;--ink:#141210;}
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-weight:300;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .container{max-width:1500px;margin:0 auto;padding:0 clamp(1.2rem,4vw,3rem);}
  .nav{padding:1.6rem 0;}
  .nav .container{display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;}
  .nav-links{display:flex;gap:2rem;list-style:none;margin:0;padding:0;}
  .nav-links a{font-family:var(--sans);font-weight:500;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;}

  .hero-row{display:grid;grid-template-columns:.95fr 1.15fr;gap:2.5rem;align-items:center;padding:2rem 0 3rem;}
  .hero-row h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,4.5vw,3.3rem);line-height:1.06;text-transform:uppercase;margin:0;}
  .hr{width:46px;height:1px;background:var(--ink);margin:1.4rem 0;}
  .hero-row p{font-size:1rem;line-height:1.7;max-width:34ch;color:#3a3630;}
  .hero-cta{display:inline-flex;align-items:center;gap:.7rem;margin-top:1.2rem;font-family:var(--sans);font-weight:500;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;}

  .hero-img{position:relative;aspect-ratio:4/5;overflow:hidden;background:#eee;}
  .hero-img img{width:100%;height:100%;object-fit:cover;object-position:center 15%;filter:grayscale(1) contrast(1.05);}
  .badge{position:absolute;right:1.4rem;bottom:1.4rem;width:104px;height:104px;}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;padding-bottom:5rem;}
  .strip a{aspect-ratio:1/1;overflow:hidden;display:block;}
  .strip img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);}

  @media (max-width:820px){
    .hero-row{grid-template-columns:1fr;padding:1rem 0 2rem;}
    .strip{grid-template-columns:repeat(2,1fr);}
    .nav .container{flex-direction:column;gap:.9rem;}
    .nav-links{gap:1.2rem;flex-wrap:wrap;justify-content:center;}
  }
</style>
</head>
<body>

    <li><a href="#">Journal</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</div></nav>

    <div>
      <h1>Seeing beauty in the real.</h1>
      <div class="hr"></div>
      <p>Editorial and documentary photography for the moments that matter most.</p>
      <a class="hero-cta" href="../gallery.html">Explore Portfolio <span>&#10230;</span></a>
    </div>
    <div class="hero-img">
      <img src="../images/portfolio/portraits/7Z6A9028-3.jpg" alt="Studio portrait, black and white">
      <svg class="badge" viewBox="0 0 120 120">
        <defs><path id="circ" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs>
        <circle cx="60" cy="60" r="46" fill="none" stroke="#141210" stroke-width=".6"/>
        <text font-family="Playfair Display, serif" font-size="7" letter-spacing="2.2" fill="#141210"><textPath href="#circ">KAYLA LAWRENCE PHOTOGRAPHY &bull; </textPath></text>
        <text x="60" y="65" text-anchor="middle" font-size="17" fill="#141210" font-family="Playfair Display, serif">KL</text>
      </svg>
    </div>
  </div>
</div>

</html>
