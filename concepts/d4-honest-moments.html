<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--serif:'Playfair Display',serif;--sans:'Jost',sans-serif;--paper:#f2ede4;}
  *{box-sizing:border-box;}
  body{margin:0;background:#0b0b0a;color:var(--paper);font-family:var(--sans);font-weight:300;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .container{max-width:1500px;margin:0 auto;padding:0 clamp(1.2rem,4vw,3rem);}
  .nav{padding:1.6rem 0;}
  .nav .container{display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;}
  .nav-links{display:flex;gap:2rem;list-style:none;margin:0;padding:0;}
  .nav-links a{font-family:var(--sans);font-weight:500;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;}

  .split{display:grid;grid-template-columns:1fr 1fr;min-height:82vh;}
  .split-text{display:flex;flex-direction:column;justify-content:center;gap:2.2rem;padding:2rem 0;}
  .split-text h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,4.3vw,3.2rem);line-height:1.16;text-transform:uppercase;margin:0;}
  .hero-cta{display:inline-flex;align-items:center;gap:.7rem;font-family:var(--sans);font-weight:500;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;width:fit-content;}

  .cats{display:flex;gap:2rem;border-top:1px solid rgba(242,237,228,.2);padding-top:1.4rem;flex-wrap:wrap;}
  .cats a{font-family:var(--sans);font-weight:500;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(242,237,228,.85);}
  .cats a b{color:var(--paper);margin-right:.4rem;font-weight:600;}

  .about-row{display:flex;gap:1.4rem;align-items:flex-start;max-width:420px;}
  .about-row img{width:76px;height:96px;object-fit:cover;filter:grayscale(1);flex-shrink:0;}
  .about-row .label{font-family:var(--sans);font-weight:500;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,237,228,.55);margin-bottom:.5rem;}
  .about-row p{font-size:.92rem;line-height:1.6;color:rgba(242,237,228,.85);margin:0 0 .7rem;}
  .about-row a{font-family:var(--sans);font-weight:500;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;}

  .split-img{overflow:hidden;}
  .split-img img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}

  @media (max-width:860px){
    .split{grid-template-columns:1fr;}
    .split-img{aspect-ratio:4/5;order:-1;}
    .nav .container{flex-direction:column;gap:.9rem;}
    .nav-links{gap:1.1rem;flex-wrap:wrap;justify-content:center;}
    .cats{gap:1.2rem 1.6rem;}
  }
</style>
</head>
<body>

    <li><a href="#">Journal</a></li>
    <li><a href="../contact.html">Contact</a></li>

</div></nav>

<div class="container">

    <div class="split-text">
      <div>
        <h1>Honest moments.<br>Artful storytelling.<br>Timeless images.</h1>
        <a class="hero-cta" href="../gallery.html" style="margin-top:1.6rem;">Explore Portfolio <span>&#10230;</span></a>
      </div>
      <div class="cats">
        <a href="../gallery.html#weddings"><b>01</b>Weddings</a>
        <a href="../gallery.html#portraits"><b>02</b>Portraits</a>
        <a href="#"><b>03</b>Editorial</a>
        <a href="#"><b>04</b>Branding</a>
      </div>
      <div class="about-row">
        <img src="../images/portfolio/portraits/7Z6A9028-3.jpg" alt="Studio portrait">
        <div>
          <div class="label">About Kayla</div>
          <p>I believe the most meaningful photographs come from trust, intention, and presence.</p>
          <a href="../about.html">Read More <span>&#10230;</span></a>
        </div>
      </div>
    </div>
    <div class="split-img">
      <img src="../images/portfolio/portraits/527A6550.jpg" alt="Editorial portrait">
    </div>
  </div>
</div>

</body>
</html>
