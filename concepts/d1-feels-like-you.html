<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D1 — Feels Like You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--serif:'Playfair Display',serif;--sans:'Jost',sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:#000;color:#fff;font-family:var(--sans);font-weight:300;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .container{max-width:1500px;margin:0 auto;padding:0 clamp(1.2rem,4vw,3rem);}
  .nav{position:absolute;top:0;left:0;right:0;z-index:2;padding:1.6rem 0;}
  .nav .container{display:flex;align-items:center;justify-content:space-between;}
  .wordmark{font-family:var(--serif);font-size:1rem;letter-spacing:.1em;text-transform:uppercase;}
  .nav-links{display:flex;gap:2rem;list-style:none;margin:0;padding:0;}
  .nav-links a{font-family:var(--sans);font-weight:500;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;}

  .hero{position:relative;height:100vh;min-height:640px;overflow:hidden;}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(100deg,rgba(6,8,12,.75) 0%,rgba(6,8,12,.25) 45%,rgba(6,8,12,.05) 65%);}
  .hero-content{position:absolute;left:0;bottom:14%;z-index:2;max-width:640px;padding:0 clamp(1.2rem,4vw,3rem);}
  .hero-title{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.08;text-transform:uppercase;}
  .hero-sub{margin-top:1.4rem;font-size:1rem;line-height:1.7;color:rgba(255,255,255,.85);}
  .hero-cta{display:inline-flex;align-items:center;gap:.7rem;margin-top:1.8rem;font-family:var(--sans);font-weight:500;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;}
  .hero-cta .arrow{font-size:1rem;}
  .hero-tag{position:absolute;left:0;bottom:2.4rem;z-index:2;padding:0 clamp(1.2rem,4vw,3rem);font-family:var(--sans);font-weight:500;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);}

  @media (max-width:820px){
    .nav .container{flex-direction:column;align-items:flex-start;gap:.8rem;}
    .nav-links{gap:1.1rem;flex-wrap:wrap;}
    .hero-content{bottom:18%;}
    .hero-tag{bottom:1.6rem;}
  }
</style>
</head>
<body>

<nav class="nav"><div class="container">
  <a class="wordmark" href="../index.html">Kayla Lawrence</a>
  <ul class="nav-links">
    <li><a href="../gallery.html">Portfolio</a></li>
    <li><a href="../about.html">About</a></li>
    <li><a href="#">Journal</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</div></nav>

<header class="hero">
  <img src="../images/portfolio/portraits/527A4218.jpg" alt="Editorial portrait of two people on a sports field at night">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1 class="hero-title">Photography that feels like you.</h1>
    <p class="hero-sub">Honest moments.<br>Artful storytelling.<br>Timeless images.</p>
    <a class="hero-cta" href="../gallery.html">View Portfolio <span class="arrow">&#10230;</span></a>
  </div>
  <div class="hero-tag">Based in New York</div>
</header>

</body>
</html>
